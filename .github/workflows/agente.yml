name: Agente Bandi

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cerca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python agente.py

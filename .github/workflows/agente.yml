name: Agente Bandi

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cerca:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python agente.py
      - name: Commit risultati
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add risultati.json
          git diff --cached --quiet || git commit -m "Aggiornamento bandi $(date)"
          git push
